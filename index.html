<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standing in Sound</title>
<style>
:root{--bg:#efef92;--ink:#251f1f;--muted:#6d6868;--button:#282121}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif} body{overflow-x:hidden}
.page{height:100vh;overflow:hidden;padding:18px 42px 18px}.brand{font-size:34px;font-weight:700;line-height:.92;letter-spacing:-1.8px;margin-bottom:12px}
.workspace{display:grid;grid-template-columns:132px minmax(360px,470px) minmax(640px,1fr);gap:30px;align-items:start;max-width:1780px;margin:0 auto;height:calc(100vh - 86px)}
.room-nav{align-self:stretch;border-right:1px solid rgba(37,31,31,.55);padding:42px 18px 42px 0;display:flex;flex-direction:column;justify-content:center;gap:17px}
.room-tab{width:100%;border:0;background:transparent;color:var(--muted);padding:0;text-align:left;cursor:pointer;font:inherit}.room-tab .no{display:block;font-size:10px;font-weight:700;line-height:1;margin-bottom:5px}.room-tab .name{display:block;font-size:21px;line-height:1.03;letter-spacing:-.55px;white-space:nowrap}.room-tab.active{color:var(--ink)}.room-tab.active .name{font-weight:700}.room-tab.disabled{cursor:default}
.sheet-panel{width:100%;background:transparent;border:0;padding:34px 0 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start}.sheet-panel img{display:block;width:auto;height:min(72vh,690px);max-width:100%;background:transparent;border:0;box-shadow:none}.sheet-caption{font-size:12px;color:rgba(37,31,31,.72);margin-top:6px}
.assembly-panel{position:relative;min-width:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:34px}.stage{position:relative;transition:aspect-ratio .2s ease;flex:0 0 auto;height:min(56vh,560px);width:auto;max-width:100%;margin-left:-50px}.stage.cave{aspect-ratio:2048/1264;height:min(47.6vh,476px);margin-top:max(0px,calc(min(67.2vh,672px) - min(47.6vh,476px) - 80px))}.stage.forest{aspect-ratio:2048/1885;height:min(67.2vh,672px);margin-top:-50px}
.layer{position:absolute;height:auto;pointer-events:none;opacity:0;transition:opacity .28s ease,filter .28s ease;transform-origin:center center}.layer.show{opacity:1}
/* Cave */
#c-floor{left:0;top:29.5886%;width:100%;z-index:1}#c-arch1{left:15.90%;bottom:36.08%;width:68.20%;z-index:2}#c-arch2{left:14.55%;bottom:36.08%;width:70.90%;z-index:3}#c-stalagmite{left:20.0684%;top:21.1234%;width:56.543%;z-index:4}#c-arch3{left:10.75%;bottom:36.08%;width:78.50%;z-index:5}#c-bat{left:calc(18.75% + 100px);top:9.4937%;width:40.8691%;z-index:6}#c-arch4{left:7.35%;bottom:36.08%;width:85.30%;z-index:7}#c-crystal{left:50.9766%;top:42.4842%;width:39.1602%;z-index:8}
/* Overgrown: proportions taken from the 2048x1885 assembled reference */
#o-floor{left:0%;bottom:0%;width:100%;z-index:1}
#o-root{left:5.0%;top:11.0%;width:90.8%;z-index:4}
#o-vine{left:calc(24.5% - 30px);top:calc(23.0% - 10px);width:62.8%;z-index:2}
#o-tree1{left:0.0%;top:auto;bottom:15.8%;width:29.2%;z-index:7}
#o-tree2{left:11.5%;top:48.0%;width:34.6%;z-index:10}
#o-tree3{left:31.0%;top:auto;bottom:15.8%;width:21.4%;z-index:9}
#o-mushTrunk{left:72.5%;top:51.0%;width:20.7%;z-index:5}
#o-mushLog{left:57.5%;top:69.0%;width:33.4%;z-index:6}
#o-birds{left:calc(55.0% - 50px);top:calc(1.0% - 30px);width:38.5%;z-index:3}
/* motions */
#c-floor.show,#o-floor.show{animation:floorPulse .54545s cubic-bezier(.22,.8,.3,1) infinite}.c-arch.show{animation:archBreath 2.1818s ease-in-out infinite}#c-stalagmite.show{animation:stalagmitePulse 1.0909s ease-in-out infinite}#c-crystal.show{animation:crystalGlow .81818s ease-in-out infinite}#c-bat.show{animation:echoFloat .27273s cubic-bezier(.2,.75,.25,1) infinite}
#o-root.show{animation:rootSway 2.1818s ease-in-out infinite}#o-vine.show{animation:vineSway 1.0909s ease-in-out infinite}.mushroom.show{animation:mushBounce .54545s ease-in-out infinite}.tree.show{animation:treeSway 1.55s ease-in-out infinite}.tree.t2.show{animation-delay:-.28s}.tree.t3.show{animation-delay:-.56s}#o-birds.show{animation:birdChatter .54545s steps(2,end) infinite}
@keyframes floorPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.006)}}@keyframes archBreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.025)}}@keyframes stalagmitePulse{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.012)}}@keyframes crystalGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) drop-shadow(0 0 10px rgba(115,220,255,.34))}}@keyframes echoFloat{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(2px,-3px) scale(1.012)}55%{transform:translate(-1px,1px) scale(.995)}}
@keyframes rootSway{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(.45deg) scale(1.006)}}@keyframes vineSway{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(4px) rotate(.5deg)}}@keyframes mushBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.015)}}@keyframes treeSway{0%,100%{transform:translateX(0) rotate(-.35deg)}50%{transform:translateX(3px) rotate(1.15deg)}}@keyframes birdChatter{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(2px,-2px) scale(1.01)}50%{transform:translate(-1px,1px) scale(.995)}75%{transform:translate(1px,-1px) scale(1.006)}}
.controls{position:absolute;top:calc(34px + min(72vh,690px) - 52px);left:50%;transform:translateX(calc(-50% - 25px));width:min(100%,920px);display:grid;gap:10px}.controls.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.controls.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.sound-btn{appearance:none;border:1px solid var(--button);background:#f5f3e8;color:var(--ink);min-height:52px;padding:10px 7px;font-size:11px;font-weight:700;cursor:pointer;transition:background .16s ease,color .16s ease,transform .16s ease}.sound-btn:hover{transform:translateY(-1px)}.sound-btn.active{background:var(--button);color:white}.legend{position:absolute;top:calc(34px + min(72vh,690px) + 2px);left:50%;transform:translateX(calc(-50% - 25px));width:min(100%,920px);display:grid;gap:10px;text-align:center;font-size:10px;color:rgba(37,31,31,.67)}.legend.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.legend.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.audio-status{position:absolute;top:calc(34px + min(72vh,690px) + 22px);left:50%;transform:translateX(calc(-50% - 25px));width:min(100%,920px);font-size:10px;letter-spacing:.03em;color:rgba(37,31,31,.62);text-align:right}
@media(max-width:1280px){.page{padding-left:26px;padding-right:26px}.workspace{grid-template-columns:112px minmax(300px,390px) minmax(500px,1fr);gap:22px}.room-tab .name{font-size:18px}.brand{font-size:30px}.sheet-panel img{height:min(70vh,620px)}.stage{height:min(52vh,500px)}}@media(max-width:980px){.workspace{grid-template-columns:96px 1fr;align-items:start}.assembly-panel{grid-column:1/-1;margin-top:14px;padding-top:16px}.sheet-panel{grid-column:2;padding-top:16px}.sheet-panel img{height:min(62vh,560px)}.stage{height:min(50vh,460px)}}@media(max-width:680px){html,body{overflow:auto}.page{height:auto;min-height:100vh;overflow:visible;padding:22px 16px}.workspace{display:block}.room-nav{border-right:0;border-bottom:1px solid rgba(37,31,31,.35);padding:0 0 16px;margin-bottom:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.room-tab .name{font-size:17px}.sheet-panel{max-width:460px;margin:0 auto 24px;padding-top:0;align-items:center}.sheet-panel img{height:auto;width:100%;max-width:100%}.assembly-panel{padding-top:0;display:flex;gap:12px}.stage{height:auto;width:min(100%,760px);margin-left:0}.stage.cave,.stage.forest{margin-top:0}.controls,.legend,.audio-status{position:static;transform:none;width:100%;margin-left:0}.controls,.legend{grid-template-columns:1fr 1fr!important}.legend{display:none}}
@media(prefers-reduced-motion:reduce){.layer{animation:none!important;transition:none}}
</style>
</head><body><div class="page"><div class="brand">STANDING<br>IN SOUND</div><main class="workspace">
<nav class="room-nav" aria-label="Spaces">
<button class="room-tab active" data-theme="cave"><span class="no">No.1</span><span class="name">Hollowed</span></button>
<button class="room-tab" data-theme="forest"><span class="no">No.2</span><span class="name">Overgrown</span></button>
<button class="room-tab disabled"><span class="no">No.3</span><span class="name">Undefined</span></button><button class="room-tab disabled"><span class="no">No.4</span><span class="name">Industrial</span></button><button class="room-tab disabled"><span class="no">No.5</span><span class="name">Submerged</span></button><button class="room-tab disabled"><span class="no">No.6</span><span class="name">Frozen</span></button><button class="room-tab disabled"><span class="no">No.7</span><span class="name">Scorched</span></button><button class="room-tab disabled"><span class="no">No.8</span><span class="name">Floating</span></button>
</nav>
<section class="sheet-panel"><img id="sheetImg" src="assets/cave_parts_sheet.webp" alt="Parts sheet"><div class="sheet-caption" id="sheetCaption">No.1 · Hollowed / CAVE · Parts Sheet</div></section>
<section class="assembly-panel"><div class="stage cave" id="stage"></div><div class="controls c5" id="controls"></div><div class="legend c5" id="legend"></div><div class="audio-status" id="audioStatus">110 BPM · all layers off · click a sound layer to start</div></section>
</main></div>
<script>
const THEMES={
 cave:{caption:'No.1 · Hollowed / CAVE · Parts Sheet',sheet:'assets/cave_parts_sheet.webp',stageClass:'cave',groups:[
  {key:'floor',label:'01 FLOOR',legend:'low pulse / ground',audio:'audio/01_floor_110bpm.mp3',ids:['c-floor']},
  {key:'arch',label:'02 ARCH',legend:'frame / cave shell',audio:'audio/02_arch_110bpm.mp3',ids:['c-arch1','c-arch2','c-arch3','c-arch4']},
  {key:'stalagmite',label:'03 STALAGMITE',legend:'inner structure',audio:'audio/03_stalagmite_110bpm.mp3',ids:['c-stalagmite']},
  {key:'crystal',label:'04 CRYSTAL',legend:'accent / sparkle',audio:'audio/04_crystal_110bpm.mp3',ids:['c-crystal']},
  {key:'bat',label:'05 BAT ECHO',legend:'echo / high fx',audio:'audio/05_bat_echo_110bpm.mp3',ids:['c-bat']}
 ],layers:[
  ['c-floor','assets/cave_floor_assembled.webp','layer'],['c-arch1','assets/cave_arch_1_assembled.webp','layer c-arch'],['c-arch2','assets/cave_arch_2_assembled.webp','layer c-arch'],['c-arch3','assets/cave_arch_3_assembled.webp','layer c-arch'],['c-stalagmite','assets/cave_stalagmite_assembled.webp','layer'],['c-bat','assets/cave_bat_echo_assembled.webp','layer'],['c-arch4','assets/cave_arch_4_assembled.webp','layer c-arch'],['c-crystal','assets/cave_crystal_assembled.webp','layer']
 ]},
 forest:{caption:'No.2 · Overgrown / FOREST · Parts Sheet',sheet:'assets/overgrown_parts_sheet.webp',stageClass:'forest',groups:[
  {key:'floor',label:'01 FOREST FLOOR',legend:'soft pulse / ground',audio:'audio/overgrown_01_floor_110bpm.mp3',ids:['o-floor']},
  {key:'root',label:'02 ROOT ARCH',legend:'woody frame / sway',audio:'audio/overgrown_02_root_arch_110bpm.mp3',ids:['o-root']},
  {key:'vine',label:'03 VINE CURTAIN',legend:'rustle / hanging layer',audio:'audio/overgrown_03_vine_curtain_110bpm.mp3',ids:['o-vine']},
  {key:'mushroom',label:'04 MUSHROOM',legend:'trunk + log / bounce',audio:'audio/overgrown_04_mushroom_110bpm.mp3',ids:['o-mushTrunk','o-mushLog']},
  {key:'tree',label:'05 TREE GROVE',legend:'3 parts / light sway',audio:'audio/overgrown_05_tree_grove_110bpm.mp3',ids:['o-tree1','o-tree2','o-tree3']},
  {key:'birds',label:'06 BIRD CHATTER',legend:'music box / bird chatter',audio:'audio/overgrown_06_bird_chatter_110bpm.mp3',ids:['o-birds']}
 ],layers:[
  ['o-floor','assets/overgrown_floor_assembled.webp','layer'],['o-root','assets/overgrown_root_arch_assembled.webp','layer'],['o-vine','assets/overgrown_vine_curtain_assembled.webp','layer'],['o-tree1','assets/overgrown_tree_grove_01_assembled.webp','layer tree t1'],['o-tree2','assets/overgrown_tree_grove_02_assembled.webp','layer tree t2'],['o-tree3','assets/overgrown_tree_grove_03_assembled.webp','layer tree t3'],['o-mushTrunk','assets/overgrown_mushroom_trunk_assembled.webp','layer mushroom'],['o-mushLog','assets/overgrown_mushroom_log_assembled.webp','layer mushroom'],['o-birds','assets/overgrown_bird_chatter_assembled.webp','layer']
 ]}
};
let current='cave', audios=[], started=false;
const assemblyPanel=document.querySelector('.assembly-panel'), stage=document.getElementById('stage'), controls=document.getElementById('controls'), legend=document.getElementById('legend'), status=document.getElementById('audioStatus'), sheetImg=document.getElementById('sheetImg'), caption=document.getElementById('sheetCaption');
function stopAudio(){audios.forEach(a=>{a.pause();a.currentTime=0});audios=[];started=false}
function renderTheme(name){stopAudio();current=name;const th=THEMES[name];document.querySelectorAll('.room-tab[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===name));sheetImg.src=th.sheet;caption.textContent=th.caption;assemblyPanel.className='assembly-panel theme-'+name;stage.className='stage '+th.stageClass;stage.innerHTML='';th.layers.forEach(([id,src,cls])=>{const img=document.createElement('img');img.id=id;img.src=src;img.className=cls;img.alt='';stage.appendChild(img)});controls.className='controls c'+th.groups.length;legend.className='legend c'+th.groups.length;controls.innerHTML='';legend.innerHTML='';th.groups.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.className='sound-btn';b.dataset.index=i;b.textContent=g.label;b.addEventListener('click',()=>toggleGroup(i,b));controls.appendChild(b);const d=document.createElement('div');d.textContent=g.legend;legend.appendChild(d);const a=new Audio(g.audio);a.loop=true;a.preload='auto';a.volume=0;audios.push(a)});status.textContent='110 BPM · all layers off · click a sound layer to start'}
async function startSync(){if(started)return;started=true;audios.forEach(a=>{a.currentTime=0;a.volume=0});try{await Promise.all(audios.map(a=>a.play()));status.textContent='110 BPM · audio running'}catch(e){started=false;status.textContent='Audio blocked by browser — click a layer again'}}
async function toggleGroup(i,btn){if(!started)await startSync();const g=THEMES[current].groups[i];const on=btn.classList.toggle('active');g.ids.forEach(id=>document.getElementById(id)?.classList.toggle('show',on));audios[i].volume=on?1:0}
document.querySelectorAll('.room-tab[data-theme]').forEach(b=>b.addEventListener('click',()=>renderTheme(b.dataset.theme)));renderTheme('cave');
setInterval(()=>{if(!started||!audios.length)return;const master=audios[0];if(master.paused)return;for(let i=1;i<audios.length;i++){const a=audios[i];if(!a.paused&&Math.abs(a.currentTime-master.currentTime)>.035){try{a.currentTime=master.currentTime}catch(e){}}}},700);
</script></body></html>
